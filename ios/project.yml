name: ScooterCommuteETA
options:
  bundleIdPrefix: com.example.scootereta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  ScooterCommuteETA:
    type: application
    platform: iOS
    sources:
      - path: ScooterCommuteETA
        excludes:
          - "Resources/Info.plist"
    info:
      path: ScooterCommuteETA/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scootereta.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Info.plist is authored by hand (see Resources/Info.plist), not
        # generated, so the exact permission strings are under our control.
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: GRDB

  ScooterCommuteETATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScooterCommuteETATests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScooterCommuteETA
      - package: GRDB
