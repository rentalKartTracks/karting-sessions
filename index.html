<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HelmetCamHeroes — Ride along</title>
  <meta name="description" content="Explore our rental kart tracks and watch the latest helmet-cam ride.">
  <link rel="canonical" href="https://helmetcamheroes.com/">
  <link rel="icon" href="favicon.svg">
  <meta property="og:title" content="Ride along with HelmetCamHeroes">
  <meta property="og:image" content="https://helmetcamheroes.com/og-image.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/ride.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="js/ride.js"></script>
</head>
<body>
<header><div class="bar"><a class="brand" href="./">HelmetCamHeroes</a><a href="https://www.youtube.com/@HelmetCamHeroes">YouTube ↗</a></div></header>
<main>
  <h1>Ride along<span>.</span></h1>
  <p class="intro">Explore rental kart tracks from the driver’s seat.</p>
  <div class="grid">
    <section class="map-panel" aria-label="Tracks we’ve driven">
      <label for="track">Track map</label>
      <select id="track"><option value="">All tracks</option></select>
      <div id="map" aria-label="Interactive track map"></div>
      <p id="map-status" hidden></p>
    </section>
    <article aria-live="polite">
      <a id="cover" hidden aria-label="Watch featured video on YouTube"><img id="thumbnail" alt=""><span class="play" aria-hidden="true">▶</span></a>
      <div class="detail">
        <p class="eyebrow" id="label">Latest on HelmetCamHeroes</p>
        <h2 id="title">Watch the latest upload</h2>
        <p id="meta"></p>
        <a id="watch" href="https://www.youtube.com/@HelmetCamHeroes">Watch on YouTube ↗</a>
        <a id="archive" hidden>All sessions at this track →</a>
        <button id="reset" hidden>Back to latest upload</button>
      </div>
    </article>
  </div>
  <footer><a href="sessions.html">Session archive →</a></footer>
</main>
</body>
</html>
